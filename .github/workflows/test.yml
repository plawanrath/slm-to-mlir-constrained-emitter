name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/env/requirements.ci.txt
          pip install -e . --no-deps
      - name: Run tests
        run: |
          pytest -ra grammar/tests decoder/tests eval/tests data/tests \
            -m "not slow and not docker and not mlx and not ollama"
